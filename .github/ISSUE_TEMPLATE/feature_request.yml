name: Feature request / 功能建议
description: Propose a focused improvement using fictional examples.
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem, not your private submission records. Do not share config, state, sessions, cookies, credentials, SMTP auth codes, raw logs, or unpublished manuscript data.
        请使用虚构示例。新期刊/SSO 建议不代表兼容性承诺；eJournalPress MTS 不是 ScholarOne。
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting / 提交前
      options:
        - label: This request contains no secrets or private account/manuscript data and does not request bypassing access controls.
          required: true
        - label: I have read the README limitations and checked existing requests.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem / 使用问题
      description: What task is difficult today? Use synthetic examples only.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议行为
      description: Describe a focused change and any relevant CLI/config behavior without real values.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope / 替代方式与范围
      description: Include compatibility, privacy, or offline test considerations if relevant. Public provider hostnames only; no identifying account URLs.
