name: Offline unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  # Only synthetic local browser fixtures may use this opt-in repository variable.
  RUN_BROWSER_FIXTURE_TESTS: ${{ vars.RUN_BROWSER_FIXTURE_TESTS || '0' }}

jobs:
  unit-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install Python dependencies and editable package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      - name: Install Chromium for opt-in local fixture tests (Linux)
        if: env.RUN_BROWSER_FIXTURE_TESTS == '1' && runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium for opt-in local fixture tests (Windows)
        if: env.RUN_BROWSER_FIXTURE_TESTS == '1' && runner.os == 'Windows'
        run: python -m playwright install chromium

      # No real config, credentials, publisher login, SMTP, or task installers.
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
